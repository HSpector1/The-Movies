  <rect x="6" y="182" width="248" height="532" rx="8" fill="#1a1510" fill-opacity="0.72" stroke="#6b5a3e" stroke-width="2"/>
  <text x="22" y="216" font-size="22" fill="#f4e6c3" font-weight="bold">PEOPLE 12</text>
