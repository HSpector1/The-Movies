  <rect x="366" y="352" width="680" height="536" rx="8" fill="#f5eddc" stroke="#c8b895"/>
  <rect x="366" y="352" width="680" height="4" fill="#dfbb65"/>
  <rect x="366" y="356" width="680" height="96" fill="#f5eddc"/>
  <text x="386" y="392" font-size="26" font-weight="bold" fill="#6e2919">STUDIO NEXT STEPS</text>
  <text x="386" y="424" font-size="16" fill="#7a6a54">WEEK 12 · READY   ·   header 96 at 150 % — FIXED</text>
  <rect x="936" y="374" width="96" height="42" rx="5" fill="#ece2cb" stroke="#ab9977"/>
  <text x="984" y="401" font-size="16" text-anchor="middle" fill="#2b221c">&#9664; Back</text>
  <line x1="366" y1="452" x2="1046" y2="452" stroke="#c8b895"/>

  <text x="386" y="484" font-size="15" letter-spacing="1.3" fill="#615642">PICTURE 1</text>
  <text x="386" y="512" font-size="24" font-weight="bold" fill="#6e2919">The Glass Harbor</text>
  <text x="386" y="542" font-size="20" font-weight="bold" fill="#332b21">Take ready to schedule</text>
  <text x="386" y="570" font-size="19" fill="#43392d">The company and set are ready at Stage 07.</text>
  <text x="386" y="596" font-size="19" fill="#43392d">Scheduling permits the next work step; weekly</text>
  <text x="386" y="622" font-size="19" fill="#43392d">costs continue. No cash is committed here.</text>
  <text x="386" y="658" font-size="20" font-weight="bold" fill="#332b21">NEXT STEPS</text>
  <rect x="386" y="672" width="640" height="52" rx="4" fill="#e8dcc0" stroke="#9c8b68"/>
  <text x="402" y="705" font-size="19" fill="#332b21">Schedule shooting take</text>
  <text x="402" y="742" font-size="17" fill="#43392d">Estimate available at the stage; the crew is on the lot.</text>
  <rect x="386" y="756" width="640" height="52" rx="4" fill="#e8dcc0" stroke="#9c8b68"/>
  <text x="402" y="789" font-size="19" fill="#332b21">Review the release of A Small Kindness</text>
  <text x="386" y="828" font-size="17" fill="#7a6a54">OTHER STUDIO ACTIONS · research decisions · notices</text>
  <text x="386" y="856" font-size="17" fill="#7a6a54">Save Game and Load Game are in the Studio Menu — MENU,</text>
  <text x="386" y="878" font-size="17" fill="#7a6a54">top right, or press Esc.</text>
  <rect x="1032" y="462" width="12" height="260" rx="6" fill="#c9b894"/>
  <text x="1052" y="520" font-size="13" fill="#3f3729">body SCROLLS</text>
  <text x="1052" y="540" font-size="13" fill="#3f3729">element memo-scroll</text>
  <text x="1052" y="560" font-size="13" fill="#3f3729">(name preserved)</text>
  <text x="1052" y="592" font-size="13" fill="#3f3729">every memo-intent-*</text>
  <text x="1052" y="612" font-size="13" fill="#3f3729">and memo-research-*</text>
  <text x="1052" y="632" font-size="13" fill="#3f3729">keeps its exact name,</text>
  <text x="1052" y="652" font-size="13" fill="#3f3729">order and enable law</text>
  <text x="1052" y="684" font-size="13" fill="#3f3729">content width 652</text>
  <text x="1052" y="704" font-size="13" fill="#3f3729">vs the memo's 372</text>

  <rect x="288" y="352" width="78" height="536" fill="none" stroke="#2e7a4d" stroke-dasharray="5 4"/>
  <rect x="1046" y="352" width="78" height="536" fill="none" stroke="#2e7a4d" stroke-dasharray="5 4"/>

  <rect x="0" y="900" width="1440" height="220" fill="#efe7d4"/>
  <text x="16" y="936" font-size="17" font-weight="bold" fill="#2b221c">Studio next steps sheet — 1440x900, 150 % text · state S7 (memo/details view explicitly opened)</text>
  <text x="16" y="960" font-size="13" fill="#4e4238">Opens ONLY on an explicit act: the tools-row chip, the band's Details control, or the key 3. There is no automatic popup, no timed reveal and no guided tutorial. A new blocker changes the chip's pip and the band's words — never the sheet's visibility.</text>
  <text x="16" y="980" font-size="13" fill="#4e4238">x 366..1046 (min(W, 680)), bottom-anchored at B=888, height = min(content, B &#8722; 166 &#8722; 66 &#8722; 12 &#8722; 12 &#8722; 96). Fixed header + scrolling body; no fixed action footer, which is what lets it also fit at 1280x720 / 200 %.</text>
  <text x="16" y="1000" font-size="13" fill="#4e4238">Body order is the memo's own order, unchanged: week/connection, feedback, paused notice, founding guidance, the journey block, the four-part rejection notice, NEXT STEPS, research, OTHER STUDIO ACTIONS, pointers, lot summary.</text>
  <text x="16" y="1020" font-size="13" fill="#4e4238">Not a modal. Both rails stay drawn, scrollable, focusable and clickable. Escape collapses an expanded group first, then pops one level; Back pops the same stack and returns focus to the control that opened the sheet.</text>
  <text x="16" y="1040" font-size="13" fill="#4e4238">Two states cost one extra explicit click and nothing else: the cast-choice group (buttons are 54 tall and cannot sit in a one-row band) and the legacy fail-closed Save Studio / Load Studio buttons. No route, explanation or consequential review is dropped.</text>
  <text x="16" y="1060" font-size="13" fill="#4e4238">The sheet replaces a permanent 400 px full-height column that cost 400 px of lot in every state; it costs the lot only while the player is reading it, and gives the memo 652 px of content width instead of 372.</text>
  <text x="16" y="1090" font-size="12" fill="#7a6a54">Fictional fixture labels reused from the R3 previews. Hand-authored SVG; generic font families only; no external font, image or network resource.</text>
</svg>
