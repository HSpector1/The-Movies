  <rect x="764" y="166" width="360" height="66" rx="6" fill="#3a3025" stroke="#e0bd6a" stroke-width="3"/>
  <rect x="761" y="163" width="366" height="72" rx="8" fill="none" stroke="#187bb8" stroke-width="3"/>
  <text x="780" y="208" font-size="19" fill="#f2e8d2" font-weight="bold">Studio next steps · 3  &#9656;</text>
