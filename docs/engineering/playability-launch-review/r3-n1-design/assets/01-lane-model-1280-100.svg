<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"
     font-family="sans-serif" role="img"
     aria-label="R3-N1 lane model at 1280 by 720, 100 percent text: employees rail left, hybrid picture cards right, lot centre lane with a tools row and a compact next-action band, and the current full-height memo footprint ghosted for comparison.">
  <title>R3-N1 — lane model, 1280x720, 100 % text (states S1 and S2/S3)</title>
  <rect x="0" y="0" width="1280" height="900" fill="#efe7d4"/>

  <!-- lot (the primary game surface) -->
  <rect x="0" y="0" width="1280" height="720" fill="#b9b08a"/>
  <g opacity="0.55" fill="none" stroke="#8d8768" stroke-width="2">
    <path d="M-40 300 L 700 660 L 1340 340"/>
    <path d="M-40 420 L 620 760"/>
    <path d="M300 180 L 1000 540"/>
  </g>
  <g opacity="0.7">
    <polygon points="430,300 540,352 430,404 320,352" fill="#9c7d5a" stroke="#6f5740" stroke-width="2"/>
    <polygon points="700,380 812,432 700,484 588,432" fill="#8a9c7a" stroke="#5e6b52" stroke-width="2"/>
    <polygon points="880,270 970,312 880,354 790,312" fill="#a98f6b" stroke="#6f5740" stroke-width="2"/>
    <text x="430" y="356" font-size="13" text-anchor="middle" fill="#2b221c">Stage 07</text>
    <text x="700" y="436" font-size="13" text-anchor="middle" fill="#2b221c">Production Post</text>
    <text x="880" y="316" font-size="13" text-anchor="middle" fill="#2b221c">Casting</text>
  </g>

  <!-- top band: living-time chip + MENU -->
  <rect x="430" y="18" width="620" height="64" rx="6" fill="#2a231c" stroke="#a5823c" stroke-width="2"/>
  <text x="446" y="44" font-size="15" fill="#f2e8d2" font-weight="bold">START 1920 · WK 12</text>
  <text x="446" y="66" font-size="12" fill="#c3b696">1x  2x  4x   ·   living-time chip  430..1050 · y 18..82  [NAT]</text>
  <rect x="1172" y="12" width="96" height="40" rx="5" fill="#2a231c" stroke="#a5823c" stroke-width="2"/>
  <text x="1220" y="38" font-size="14" fill="#f2e8d2" text-anchor="middle" font-weight="bold">MENU</text>

  <!-- ghost of TODAY's full-height memo -->
  <rect x="266" y="18" width="400" height="684" rx="6" fill="#d9534f" fill-opacity="0.10"
        stroke="#b23a36" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="276" y="120" font-size="13" fill="#8e2f2b" font-weight="bold">TODAY: journey memo</text>
  <text x="276" y="138" font-size="12" fill="#8e2f2b">x 266..666, full height  [NAT]</text>
  <text x="276" y="156" font-size="12" fill="#8e2f2b">lot centre left = 316 px</text>
  <text x="276" y="180" font-size="12" fill="#8e2f2b">overlaps the chip by 236 px</text>
  <text x="276" y="198" font-size="12" fill="#8e2f2b">in the top band (x 430..666)</text>

  <!-- employees rail (left) -->
  <rect x="6" y="88" width="248" height="626" rx="8" fill="#1a1510" fill-opacity="0.72" stroke="#6b5a3e" stroke-width="2"/>
  <text x="22" y="116" font-size="15" fill="#f4e6c3" font-weight="bold">PEOPLE 12</text>
  <text x="196" y="116" font-size="12" fill="#c3b696">3 free</text>
  <text x="22" y="140" font-size="12" fill="#c3b696">All 12  Talent 6  Writers 3  Crew 3</text>
  <rect x="18" y="150" width="224" height="26" rx="4" fill="#3a3025" stroke="#8d7954"/>
  <text x="28" y="168" font-size="12" fill="#c3b696">Name, role or ID</text>
  <g>
    <rect x="18" y="186" width="224" height="78" rx="6" fill="#f5eddc" stroke="#c8b895"/>
    <rect x="28" y="196" width="44" height="53" rx="3" fill="#cdbb99" stroke="#a08d6a"/>
    <text x="82" y="212" font-size="14" font-weight="bold" fill="#2b221c">Mara Vale</text>
    <text x="82" y="230" font-size="12" fill="#4e4238">Director</text>
    <rect x="82" y="238" width="78" height="18" rx="3" fill="#dcecdc" stroke="#2e7a4d"/>
    <text x="88" y="251" font-size="11" fill="#1d5a36">On set</text>
    <rect x="18" y="270" width="224" height="78" rx="6" fill="#f5eddc" stroke="#c8b895"/>
    <rect x="28" y="280" width="44" height="53" rx="3" fill="#cdbb99" stroke="#a08d6a"/>
    <text x="82" y="296" font-size="14" font-weight="bold" fill="#2b221c">Nora Finch</text>
    <text x="82" y="314" font-size="12" fill="#4e4238">Actor</text>
    <rect x="18" y="354" width="224" height="78" rx="6" fill="#ece2cb" stroke="#c8b895"/>
    <rect x="18" y="438" width="224" height="78" rx="6" fill="#ece2cb" stroke="#c8b895"/>
  </g>
  <text x="22" y="706" font-size="11" fill="#c3b696">Hire more at the Casting building  &#9656;</text>
  <text x="14" y="738" font-size="12" fill="#5a4c3a">236 px  [NAT]  ·  plate xMax 254</text>

  <!-- pictures rail (right) -->
  <rect x="994" y="88" width="280" height="626" rx="8" fill="#1a1510" fill-opacity="0.72" stroke="#6b5a3e" stroke-width="2"/>
  <text x="1008" y="116" font-size="15" fill="#f4e6c3" font-weight="bold">PICTURES 7</text>
  <text x="1178" y="116" font-size="12" fill="#e0bd6a">3 decisions</text>
  <rect x="1006" y="128" width="180" height="26" rx="4" fill="#3a3025" stroke="#8d7954"/>
  <text x="1014" y="146" font-size="12" fill="#e7dcc0">Active · 7  &#9662;</text>
  <rect x="1194" y="128" width="68" height="26" rx="4" fill="#3a3025" stroke="#8d7954"/>
  <text x="1204" y="146" font-size="12" fill="#e7dcc0">Find</text>
  <g>
    <rect x="1006" y="164" width="256" height="91" rx="8" fill="#fff9e9" stroke="#ab9972"/>
    <rect x="1012" y="170" width="72" height="78" rx="8" fill="#e7e5d4" stroke="#b5a783"/>
    <text x="1092" y="188" font-size="14" font-weight="bold" fill="#2b221c">Letters from June</text>
    <text x="1092" y="206" font-size="11" fill="#615642">WRITING</text>
    <text x="1092" y="224" font-size="12" fill="#4d493e">Draft in progress</text>
    <rect x="1006" y="262" width="256" height="91" rx="8" fill="#fff8df" stroke="#9d7123" stroke-width="2"/>
    <circle cx="1080" cy="268" r="11" fill="#e9bd4e" stroke="#957029"/>
    <text x="1080" y="273" font-size="15" text-anchor="middle" font-weight="bold" fill="#483300">!</text>
    <rect x="1012" y="268" width="72" height="78" rx="8" fill="#e7e5d4" stroke="#b5a783"/>
    <text x="1092" y="286" font-size="14" font-weight="bold" fill="#2b221c">The Glass Harbor</text>
    <text x="1092" y="304" font-size="11" fill="#615642">SHOOTING</text>
    <text x="1092" y="322" font-size="12" font-weight="bold" fill="#76540c">! Schedule take</text>
    <rect x="1006" y="360" width="256" height="91" rx="8" fill="#f5eddc" stroke="#ab9972"/>
    <rect x="1006" y="458" width="256" height="91" rx="8" fill="#f5eddc" stroke="#ab9972"/>
  </g>
  <text x="1008" y="694" font-size="11" fill="#e7dcc0">1-6 of 7   ·   Film library 1</text>
  <text x="1040" y="738" font-size="12" fill="#5a4c3a">268 px  [NAT]  ·  plate xMin 994</text>

  <!-- lane guides -->
  <line x1="266" y1="88" x2="266" y2="714" stroke="#2e7a4d" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="982" y1="88" x2="982" y2="714" stroke="#2e7a4d" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- tools row -->
  <rect x="266" y="94" width="176" height="44" rx="6" fill="#2a231c" stroke="#a5823c" stroke-width="2"/>
  <text x="354" y="122" font-size="15" text-anchor="middle" fill="#f2e8d2" font-weight="bold">BUILD</text>
  <rect x="742" y="94" width="240" height="44" rx="6" fill="#2a231c" stroke="#e0bd6a" stroke-width="2"/>
  <circle cx="762" cy="116" r="8" fill="#e9bd4e" stroke="#957029"/>
  <text x="762" y="121" font-size="12" text-anchor="middle" font-weight="bold" fill="#483300">!</text>
  <text x="778" y="121" font-size="13" fill="#f2e8d2" font-weight="bold">Studio next steps · 3  &#9656;</text>

  <!-- next-action band -->
  <rect x="266" y="150" width="716" height="100" rx="8" fill="#f5eddc" stroke="#c8b895" stroke-width="1"/>
  <rect x="266" y="150" width="716" height="4" fill="#dfbb65"/>
  <text x="282" y="176" font-size="11" letter-spacing="1.4" fill="#615642">NEXT STEP · PICTURE 1</text>
  <text x="282" y="200" font-size="16" font-weight="bold" fill="#2b221c">The Glass Harbor is ready to schedule a take.</text>
  <text x="282" y="222" font-size="13" fill="#4e4238">The company and set are ready. Scheduling permits the next work step; weekly costs continue.</text>
  <text x="282" y="240" font-size="13" fill="#4e4238">Stage 07 · no cash is committed by scheduling.</text>
  <rect x="640" y="186" width="200" height="34" rx="5" fill="#2e7a4d" stroke="#1d5a36"/>
  <text x="740" y="208" font-size="14" text-anchor="middle" fill="#fff8e6" font-weight="bold">Schedule shooting take</text>
  <rect x="852" y="186" width="118" height="34" rx="5" fill="#ece2cb" stroke="#ab9977"/>
  <text x="911" y="208" font-size="13" text-anchor="middle" fill="#2b221c">Details &#9656;</text>

  <!-- selection receipt (state S2/S3) -->
  <rect x="562" y="562" width="420" height="146" rx="8" fill="#f5eddc" fill-opacity="0.92" stroke="#c8b895" stroke-dasharray="6 4"/>
  <text x="576" y="586" font-size="11" letter-spacing="1.2" fill="#615642">SELECTION RECEIPT (state S2 / S3 only)</text>
  <text x="576" y="608" font-size="14" font-weight="bold" fill="#2b221c">Stage 07 — selected</text>
  <text x="576" y="628" font-size="12" fill="#4e4238">x 562..982, y 562..708  [NAT]  ·  holds hud-open-laboratory</text>
  <text x="576" y="646" font-size="12" fill="#4e4238">At 150 % / 200 % it grows and the band yields (§B.4).</text>

  <!-- clear lot callout -->
  <rect x="266" y="262" width="716" height="288" fill="none" stroke="#2e7a4d" stroke-width="2"/>
  <text x="624" y="286" font-size="14" text-anchor="middle" fill="#1d5a36" font-weight="bold">clear, clickable lot centre</text>
  <text x="624" y="306" font-size="13" text-anchor="middle" fill="#1d5a36">S1: 716 x 458  ·  S2/S3: 716 x 300 + 284 x 158  [REC]</text>

  <!-- caption -->
  <rect x="0" y="720" width="1280" height="180" fill="#efe7d4"/>
  <text x="16" y="768" font-size="17" font-weight="bold" fill="#2b221c">R3-N1 lane model — 1280x720, 100 % text · states S1 (main) and S2/S3 (selected)</text>
  <text x="16" y="792" font-size="13" fill="#4e4238">Lane L=266, R=982, W=716, T=94, B=708 [REC, derived from NAT rail edges 254 / 994]. Tools row 94..138 never yields. Band 150..250 yields on a short lane.</text>
  <text x="16" y="812" font-size="13" fill="#4e4238">Red dashed: today's full-height memo (x 266..666) — 316 px of lot left, and 236 px of overlap with the living-time chip. Green dashed: the lane edges.</text>
  <text x="16" y="832" font-size="13" fill="#4e4238">Every memo route survives: the primary intent is the band's button (element memo-intent-&lt;id&gt; unchanged); all others are one explicit control away in the sheet.</text>
  <text x="16" y="852" font-size="13" fill="#4e4238">No automatic popup, no tutorial, no camera move, no new simulation behaviour. Both rails stay alive, scrollable and clickable in every state.</text>
  <text x="16" y="876" font-size="12" fill="#7a6a54">Fictional fixture labels reused from the R3 previews. Hand-authored SVG; generic font families only; no external font, image or network resource.</text>
</svg>
