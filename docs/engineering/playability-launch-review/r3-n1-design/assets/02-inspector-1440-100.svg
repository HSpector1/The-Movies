  <rect x="0" y="900" width="1440" height="180" fill="#efe7d4"/>
  <text x="16" y="936" font-size="17" font-weight="bold" fill="#2b221c">Compact inspector — 1440x900, 100 % text · states S4 / S5 / S6 (picture actionable · picture waiting · person)</text>
  <text x="16" y="960" font-size="13" fill="#4e4238">x 366..1046 (680 wide [R3], = min(W, 680)), bottom-anchored at B=888, ceiling height 630 = B − 150 − 12 − 96. Content-sized: R3's own rendered panel is 396 tall at this cell.</text>
  <text x="16" y="980" font-size="13" fill="#4e4238">NOT a modal: no scrim, both rails keep their wheel, focus rings, filters, Find, paging and library. Clicking another row re-targets the open inspector; its body starts at the top.</text>
  <text x="16" y="1000" font-size="13" fill="#4e4238">It subsumes the selection receipt's footprint and must re-publish hud-open-laboratory at its own footer rect. Nothing occludes the rails, the chips, the living-time band or MENU.</text>
  <text x="16" y="1020" font-size="13" fill="#4e4238">Escape: collapse an expanded fact group &#8594; pop one level (sheet &#8594; inspector &#8594; lot) &#8594; release rail focus &#8594; Studio Menu. Back pops the same stack and restores both rail offsets, filters, Find, selection, invoking focus.</text>
  <text x="16" y="1040" font-size="13" fill="#4e4238">Opening or closing it never pans, zooms or re-frames the camera. Only the explicit LOCATE zones move the camera, exactly as today.</text>
  <text x="16" y="1062" font-size="12" fill="#7a6a54">Baseline being replaced: today every one of these states is a full-screen workspace with a scrim — 0 px of lot, both rails hidden. Fictional R3 fixture labels. Hand-authored SVG, no external resources.</text>
</svg>
