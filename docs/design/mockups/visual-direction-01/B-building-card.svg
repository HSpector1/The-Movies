<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" font-family="Georgia, 'Iowan Old Style', serif">
  <title>Mockup B — Compact Building Card, Casting Office selected (Visual Direction 01)</title>
  <desc>Non-production reference mockup. Not an implementation asset.</desc>

  <defs>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#243033"/><stop offset="1" stop-color="#3c4a42"/></linearGradient>
    <linearGradient id="grassB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d7a52"/><stop offset="1" stop-color="#4a6543"/></linearGradient>
    <filter id="softB" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="glowB" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- world -->
  <rect width="1600" height="900" fill="url(#skyB)"/>
  <rect y="150" width="1600" height="750" fill="url(#grassB)"/>
  <path d="M0 190 L260 145 L520 198 L820 150 L1120 200 L1400 148 L1600 190 L1600 250 L0 250 Z" fill="#33423c" opacity="0.85"/>
  <path d="M0 640 L1600 500 L1600 578 L0 726 Z" fill="#3a3a38"/>

  <!-- de-emphasised neighbours -->
  <g opacity="0.5">
    <path d="M120 500 L280 468 L280 578 L120 612 Z" fill="#a99d80"/><path d="M280 468 L380 490 L380 596 L280 578 Z" fill="#8b8168"/>
    <path d="M120 500 L280 468 L380 490 L220 522 Z" fill="#6d4436"/>
    <path d="M1180 460 L1400 420 L1400 566 L1180 608 Z" fill="#9d9478"/><path d="M1400 420 L1522 444 L1522 588 L1400 566 Z" fill="#7f7761"/>
    <path d="M1180 460 L1400 420 L1522 444 L1302 484 Z" fill="#5d584c"/>
  </g>

  <!-- ===== SELECTED: CASTING OFFICE ===== -->
  <g id="casting-selected">
    <!-- selection ring on ground -->
    <ellipse cx="700" cy="742" rx="248" ry="70" fill="none" stroke="#c6a664" stroke-width="3.5" opacity="0.95"/>
    <ellipse cx="700" cy="742" rx="248" ry="70" fill="#c6a664" opacity="0.10"/>
    <path d="M520 566 L700 528 L700 664 L520 706 Z" fill="#d8cba6"/>
    <path d="M700 528 L836 558 L836 690 L700 664 Z" fill="#b5a682"/>
    <path d="M520 566 L700 528 L836 558 L656 596 Z" fill="#8f5842"/>
    <rect x="550" y="606" width="38" height="52" fill="#2f4f4a"/>
    <rect x="612" y="594" width="38" height="52" fill="#f0d99a" opacity="0.9" filter="url(#glowB)"/>
    <rect x="752" y="588" width="30" height="50" fill="#2f4f4a"/>
    <!-- marquee -->
    <rect x="520" y="540" width="180" height="16" fill="#2f4f4a" opacity="0.85"/>
    <text x="610" y="553" font-size="12" fill="#e8dcbb" text-anchor="middle" letter-spacing="2.2">CASTING</text>
  </g>

  <!-- attention marker anchored to the building -->
  <g id="attention-pin">
    <path d="M700 486 L720 522 L680 522 Z" fill="#d6a84e"/>
    <circle cx="700" cy="464" r="23" fill="#1b1813" stroke="#d6a84e" stroke-width="3"/>
    <text x="700" y="473" font-size="26" fill="#d6a84e" text-anchor="middle" font-weight="bold">!</text>
  </g>

  <!-- world nameplate -->
  <g>
    <rect x="566" y="404" width="268" height="42" rx="4" fill="#141210" opacity="0.94"/>
    <rect x="566" y="404" width="4" height="42" fill="#d6a84e"/>
    <text x="584" y="432" font-size="17" fill="#eee8da">Casting Office</text>
  </g>

  <!-- people specks -->
  <g fill="#e6dcc4" opacity="0.9"><circle cx="770" cy="712" r="4"/><circle cx="790" cy="720" r="4"/><circle cx="620" cy="726" r="4"/></g>

  <!-- ===== TOP HUD (condensed, same system as A) ===== -->
  <g filter="url(#softB)">
    <rect width="1600" height="72" fill="#141210" opacity="0.97"/>
    <line x1="0" y1="72" x2="1600" y2="72" stroke="#c6a664" stroke-width="2" opacity="0.55"/>
    <text x="34" y="30" font-size="15" fill="#b2aa98" letter-spacing="2.2">SPRING 1920</text>
    <text x="34" y="58" font-size="30" fill="#eee8da">Week 14</text>
    <line x1="228" y1="16" x2="228" y2="56" stroke="#4a4438" stroke-width="1.5"/>
    <g transform="translate(268,18)">
      <rect width="42" height="38" rx="4" fill="#c6a664"/><rect x="14" y="11" width="5" height="16" fill="#18140e"/><rect x="23" y="11" width="5" height="16" fill="#18140e"/>
      <g transform="translate(52,0)"><rect width="46" height="38" rx="4" fill="#272522" stroke="#4a4438"/><text x="23" y="25" font-size="17" fill="#b2aa98" text-anchor="middle">1×</text></g>
      <g transform="translate(106,0)"><rect width="46" height="38" rx="4" fill="#272522" stroke="#4a4438"/><text x="23" y="25" font-size="17" fill="#b2aa98" text-anchor="middle">2×</text></g>
      <g transform="translate(160,0)"><rect width="46" height="38" rx="4" fill="#272522" stroke="#4a4438"/><text x="23" y="25" font-size="17" fill="#b2aa98" text-anchor="middle">4×</text></g>
    </g>
    <line x1="500" y1="16" x2="500" y2="56" stroke="#4a4438" stroke-width="1.5"/>
    <text x="536" y="30" font-size="15" fill="#b2aa98" letter-spacing="2.2">CASH ON HAND</text><text x="536" y="58" font-size="30" fill="#eee8da">$19.9M</text>
    <text x="700" y="30" font-size="15" fill="#b2aa98" letter-spacing="2.2">WEEKLY BURN</text><text x="700" y="58" font-size="30" fill="#d99a4e">−$78K</text>
    <g transform="translate(1466,17)"><rect width="106" height="40" rx="4" fill="#272522" stroke="#4a4438"/><text x="53" y="26" font-size="16" fill="#eee8da" text-anchor="middle" letter-spacing="1.6">MENU</text></g>
  </g>

  <!-- ===== THE COMPACT BUILDING CARD ===== -->
  <g id="building-card" filter="url(#softB)">
    <rect x="1084" y="150" width="480" height="626" rx="5" fill="#141210" opacity="0.985"/>
    <rect x="1084" y="150" width="480" height="5" fill="#d6a84e"/>

    <!-- 1. HEADER: identity + state badge -->
    <text x="1112" y="192" font-size="14" fill="#8d8778" letter-spacing="2.6">BUILDING</text>
    <text x="1112" y="224" font-size="30" fill="#eee8da">Casting Office</text>
    <g transform="translate(1112,240)">
      <rect width="152" height="28" rx="3" fill="#3a2f18" stroke="#d6a84e" stroke-width="1.5"/>
      <circle cx="16" cy="14" r="7" fill="none" stroke="#d6a84e" stroke-width="1.8"/><text x="16" y="19" font-size="11" fill="#d6a84e" text-anchor="middle" font-weight="bold">!</text>
      <text x="30" y="19" font-size="14" fill="#d6a84e" letter-spacing="1.6">NEEDS YOU</text>
    </g>
    <line x1="1112" y1="290" x2="1536" y2="290" stroke="#302d26" stroke-width="1"/>

    <!-- 2. WHAT IS HERE: the production -->
    <text x="1112" y="318" font-size="14" fill="#8d8778" letter-spacing="2.6">PICTURE HERE</text>
    <text x="1112" y="350" font-size="24" fill="#eee8da">The Reluctant Cornerstone</text>
    <text x="1112" y="376" font-size="16" fill="#b2aa98">Crime · Writer: Alma Radcliffe</text>

    <!-- 3. PHASE + NOW -->
    <g transform="translate(1112,396)">
      <text y="16" font-size="16" fill="#d6a84e" letter-spacing="2">CASTING</text>
      <text x="96" y="16" font-size="16" fill="#7d786b">·</text>
      <text x="112" y="16" font-size="16" fill="#eee8da">Choosing the Director</text>
    </g>
    <!-- six-segment phase rail -->
    <g transform="translate(1112,414)">
      <rect width="64" height="6" rx="3" fill="#c6a664"/>
      <rect x="72" width="64" height="6" rx="3" fill="none" stroke="#c6a664" stroke-width="1.8"/>
      <rect x="144" width="64" height="6" rx="3" fill="#3a352b"/>
      <rect x="216" width="64" height="6" rx="3" fill="#3a352b"/>
      <rect x="288" width="64" height="6" rx="3" fill="#3a352b"/>
      <rect x="360" width="64" height="6" rx="3" fill="#3a352b"/>
    </g>
    <g transform="translate(1112,430)" font-size="11" fill="#6e6a5e" letter-spacing="0">
      <text x="0" y="12">DEV</text><text x="72" y="12" fill="#d6a84e">PRE-PRO</text><text x="144" y="12">REHRSL</text>
      <text x="216" y="12">SHOOT</text><text x="288" y="12">POST</text><text x="360" y="12">RELEASE</text>
    </g>

    <!-- 4. ROLE COMPLETION — the numeric fact -->
    <g transform="translate(1112,468)">
      <rect width="424" height="76" rx="4" fill="#1c1a16"/>
      <text x="18" y="30" font-size="44" fill="#eee8da">2</text>
      <text x="48" y="30" font-size="22" fill="#8d8778">/ 5</text>
      <text x="18" y="54" font-size="14" fill="#8d8778" letter-spacing="2.2">ROLES FILLED</text>
      <!-- role pips -->
      <g transform="translate(150,18)">
        <g><rect width="120" height="9" rx="2" fill="#c6a664"/><text y="26" font-size="13" fill="#b2aa98">Lead · cast</text></g>
        <g transform="translate(0,32)"><rect width="120" height="9" rx="2" fill="#c6a664"/><text y="26" font-size="13" fill="#b2aa98">Support · cast</text></g>
      </g>
      <g transform="translate(292,18)">
        <g><rect width="120" height="9" rx="2" fill="none" stroke="#d6a84e" stroke-width="1.6"/><text y="26" font-size="13" fill="#d6a84e">Director · now</text></g>
        <g transform="translate(0,32)"><rect width="120" height="9" rx="2" fill="#3a352b"/><text y="26" font-size="13" fill="#7d786b">Antagonist, Craft</text></g>
      </g>
    </g>

    <!-- 5. THE EXACT BLOCKER -->
    <g transform="translate(1112,566)">
      <rect width="424" height="128" rx="4" fill="#241814"/>
      <rect width="4" height="128" fill="#c45c4e"/>
      <g transform="translate(20,20)">
        <rect width="15" height="15" rx="2.5" fill="none" stroke="#c45c4e" stroke-width="2"/><line x1="1" y1="15" x2="15" y2="1" stroke="#c45c4e" stroke-width="2"/>
        <text x="26" y="13" font-size="15" fill="#c45c4e" letter-spacing="1.8">CANNOT GREENLIGHT YET</text>
      </g>
      <text x="20" y="66" font-size="16" fill="#eee8da">Three roles and both budgets are still open.</text>
      <text x="20" y="90" font-size="15" fill="#b2aa98">Until they are set, this picture cannot leave Casting</text>
      <text x="20" y="110" font-size="15" fill="#b2aa98">and no soundstage will be reserved for it.</text>
    </g>

    <!-- 6. ACTIONS: exactly one primary -->
    <g transform="translate(1112,712)">
      <rect width="424" height="48" rx="4" fill="#c6a664"/>
      <text x="212" y="31" font-size="18" fill="#18140e" text-anchor="middle" letter-spacing="1.4" font-weight="bold">OPEN CASTING</text>
    </g>
    <!-- secondary row lives just under, drawn inside card bounds -->
  </g>

  <!-- secondary actions strip (visually part of the card, drawn after for clarity) -->
  <g filter="url(#softB)">
    <rect x="1084" y="776" width="480" height="60" rx="5" fill="#141210" opacity="0.985"/>
    <g transform="translate(1112,788)">
      <rect width="200" height="40" rx="4" fill="#272522" stroke="#4a4438"/>
      <circle cx="26" cy="20" r="7" fill="none" stroke="#c6a664" stroke-width="2"/>
      <line x1="26" y1="7" x2="26" y2="11" stroke="#c6a664" stroke-width="2"/><line x1="26" y1="29" x2="26" y2="33" stroke="#c6a664" stroke-width="2"/>
      <line x1="13" y1="20" x2="17" y2="20" stroke="#c6a664" stroke-width="2"/><line x1="35" y1="20" x2="39" y2="20" stroke="#c6a664" stroke-width="2"/>
      <text x="50" y="26" font-size="16" fill="#eee8da">Locate</text>
      <g transform="translate(216,0)">
        <rect width="208" height="40" rx="4" fill="#272522" stroke="#4a4438"/>
        <text x="26" y="26" font-size="16" fill="#b2aa98" font-style="italic">i</text>
        <text x="46" y="26" font-size="16" fill="#eee8da">Picture details</text>
      </g>
    </g>
  </g>

  <!-- ===== ANNOTATIONS ===== -->
  <rect y="900" width="1600" height="300" fill="#0e0d0b"/>
  <line x1="0" y1="900" x2="1600" y2="900" stroke="#c6a664" stroke-width="2"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="34" y="932" font-size="19" fill="#c6a664" letter-spacing="2.6">MOCKUP B — COMPACT BUILDING CARD (CASTING OFFICE SELECTED)</text>
    <text x="34" y="956" font-size="14" fill="#8d8778">Reference only. The card is a compact world card, not a workspace: it explains and routes, it never commits.</text>

    <g font-size="13" fill="#b2aa98">
      <text x="30" y="998" fill="#eee8da" font-size="14.5">Fixed information order</text>
      <text x="30" y="1020">BUILDING + state badge → PICTURE HERE → PHASE ·</text>
      <text x="30" y="1039">NOW + six-segment rail → role completion → exact</text>
      <text x="30" y="1058">blocker → one primary action → Locate and details.</text>
      <text x="30" y="1077">The order never varies by state.</text>

      <text x="420" y="998" fill="#eee8da" font-size="14.5">The blocker is a receipt, not a warning</text>
      <text x="420" y="1020">It names the effect ("cannot greenlight yet"), the</text>
      <text x="420" y="1039">cause (three roles + two budgets open) and the</text>
      <text x="420" y="1058">consequence (no stage reserved). Icon + shape +</text>
      <text x="420" y="1077">text carry it; the red bar only reinforces.</text>

      <text x="810" y="998" fill="#eee8da" font-size="14.5">Numbers outrank prose</text>
      <text x="810" y="1020">"2 / 5 ROLES FILLED" is 44px against 14px caps,</text>
      <text x="810" y="1039">with per-role pips, so the player sees which two</text>
      <text x="810" y="1058">without reading a sentence. The comma run-on</text>
      <text x="810" y="1077">("Missing: Choose Director, Choose Lead…") is gone.</text>

      <text x="1200" y="998" fill="#eee8da" font-size="14.5">One primary, and it points forward</text>
      <text x="1200" y="1020">OPEN CASTING is the only brass fill on screen.</text>
      <text x="1200" y="1039">Locate and details are secondary outlines. Today's</text>
      <text x="1200" y="1058">build inverts this — Back is brass while the</text>
      <text x="1200" y="1077">forward action is grey.</text>
    </g>

    <g font-size="13" fill="#7d786b">
      <text x="30" y="1116" fill="#d6a84e" font-size="13" letter-spacing="1.4">AUTHORITY</text>
      <text x="30" y="1138">Anatomy follows Package 05 Builder Annex §C1: header → subline → title → PHASE·NOW + rail → company → blocker → max ONE primary → Open/Focus.</text>
      <text x="30" y="1157">Building identity is the stable id `casting`, never matched by title, array order or nearest building (Package 04). Card width 480px ≈ the 360–420px</text>
      <text x="30" y="1176">inspector target plus padding; body ≥16px, controls 40–44px, compact targets ≥40×40, per UX North Star §6.3.</text>
    </g>
  </g>
</svg>
