name: Bridge contract

on:
  pull_request:
  push:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:bridge-contract
      - run: npm run typecheck:bridge
      - run: npm run test:bridge
