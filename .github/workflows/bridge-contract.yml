name: TypeScript validation

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: typescript-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-tests.txt
      - name: Install authored-art test dependencies
        run: python -m pip install --disable-pip-version-check --requirement .github/requirements-tests.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Audit browser runtime dependencies
        run: npm run audit:browser-deps
      - name: Audit repository hygiene
        run: npm run audit:repo-hygiene
      - name: Verify generated bridge contract
        run: npm run check:bridge-contract
      - name: Typecheck bridge
        run: npm run typecheck:bridge
      - name: Typecheck application
        run: npm run typecheck
      - name: Test bridge
        run: npm run test:bridge
      - name: Test application
        run: npm test
      - name: Build production client
        run: npm run build
      - name: Audit adopted 3D assets
        run: npm run audit:3d-assets
